name: Capacidad
description: Nueva capacidad vinculada con requisitos
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: requirement
    attributes:
      label: Requisito
      description: Identificador FUN/NFR relacionado
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Riesgos y datos sensibles
